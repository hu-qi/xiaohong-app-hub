name: XiaoHong M Double Click Regression
on:
  pull_request:
    paths:
      - "xiaohong/xiaohong/xiaohong/**"
      - "tests/host/**"
      - "scripts/check_app_hub_visual.py"
      - ".github/workflows/m-double-click.yml"
  push:
    branches: [feat/apphub-m-double-click]
jobs:
  m-double-click:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual WS63 GN and UI event routing
        run: |
          python3 scripts/check_app_hub_visual.py
          test -f xiaohong/xiaohong/xiaohong/src/m_double_tap.c
          grep -q '"src/m_double_tap.c"' xiaohong/xiaohong/xiaohong/BUILD.gn
          ! grep -n 'volume_chord.c' xiaohong/xiaohong/xiaohong/BUILD.gn
          ! grep -R 'eKey_AppHub_Toggle' xiaohong/xiaohong/xiaohong/src
      - name: Compile M tap classifier with strict C11 warnings
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -Ixiaohong/xiaohong/xiaohong/src \
            tests/host/test_m_double_tap.c \
            xiaohong/xiaohong/xiaohong/src/m_double_tap.c \
            -o /tmp/test-m-double-tap
          /tmp/test-m-double-tap
      - name: Compile real board GPIO IRQ and preserve M long/5s
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Itests/host \
            -Ixiaohong/xiaohong/xiaohong/src/boards/xiaohong_ws63_v1 \
            tests/host/test_key_driver.c \
            xiaohong/xiaohong/xiaohong/src/boards/xiaohong_ws63_v1/key_config.c \
            -o /tmp/test-key-driver
          /tmp/test-key-driver
      - name: Verify original app lifecycle and game controls
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Itests/host -Ixiaohong/xiaohong/xiaohong/src/apps \
            tests/host/test_app_hub.c \
            xiaohong/xiaohong/xiaohong/src/apps/app_hub.c \
            -o /tmp/test-hub
          /tmp/test-hub
